name: Build Recover Standalone APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: recover-apk-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Native Recover APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android Licenses & Install SDK 34
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Native Android Project (Expo Prebuild)
        run: |
          npx expo prebuild --platform android --no-install

      - name: Bundle Offline JavaScript & Assets
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed --platform android --dev false --entry-file index.ts --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res/

      - name: Build Recover APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          mkdir -p build-outputs
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk build-outputs/Recover.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk build-outputs/Recover.apk
          fi

      - name: Verify Generated APK
        run: |
          ls -lh build-outputs/

      - name: Upload Recover Standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: Recover-APK
          path: build-outputs/Recover.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 --yes || true
          gh release create v1.0.0 build-outputs/Recover.apk --title "Recover Focus Study Wallet v1.0.0" --notes "Single standalone Recover APK." || true
